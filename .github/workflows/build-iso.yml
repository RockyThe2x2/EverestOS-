name: Build EverestOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the build needs ~25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Build the ISO
        run: sudo bash build.sh

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: EverestOS-iso
          path: |
            output/*.iso
            output/*.sha256
          compression-level: 0
          retention-days: 7

      - name: Upload the build log (if something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/lb/build.log
          if-no-files-found: ignore
